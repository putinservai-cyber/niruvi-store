name: Validate Catalog & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Validate Catalog & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate & Generate Application Catalog JSONs
        run: npm run build:catalog

      - name: Typecheck / Lint
        run: npm run lint

      - name: Run Unit & Worker API Tests
        run: npm test

      - name: Build Static Production Site (GitHub Pages mode VITE_BASE=/niruvi-store/)
        run: npm run build
        env:
          VITE_BASE: "/niruvi-store/"
          VITE_SITE_URL: "https://putinservai-cyber.github.io"
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Build Static Production Site (Custom domain mode VITE_BASE=/)
        run: npm run build
        env:
          VITE_BASE: "/"
          VITE_SITE_URL: "https://niruvi-store.runs-on.dev"
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || '' }}
